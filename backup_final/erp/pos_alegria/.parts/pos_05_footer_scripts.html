  </section>  <!-- /فرع menu -->

  <div id="floorMapDrawer" class="d-none panel-card p-3 border rounded-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <span class="fw-black small text-gold-strong"><i class="fa-solid fa-map-location-dot me-1"></i>الخريطة الحية للصالة والطاولات</span>
      <button class="btn btn-ghost btn-sm sw-action" data-title="إغلاق الخريطة"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="d-flex flex-wrap gap-2" id="liveFloorMap"></div>
  </div>

  <div id="invoiceDrawer" class="d-none panel-card p-3 border rounded-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <span class="fw-black small text-gold-strong"><i class="fa-solid fa-file-invoice-dollar me-1"></i>الفاتورة الذهبية المميزة</span>
      <button class="btn btn-ghost btn-sm sw-action" data-title="إغلاق الفاتورة"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="luxuryInvoice"></div>

<!-- ============ SCRIPTS ============ -->
<script src="../../assets/js/jquery.min.js"></script>
<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/sweetalert2.all.min.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/main.js"></script>

<script>
  (function () {
    'use strict';

    var ALEGRIA = window.ALEGRIA;
    var $toast = document.getElementById('quickToast');

    function toast(msg, type) {
      $toast.className = 'quick-toast show ' + (type || 'success');
      $toast.innerHTML = msg;
      clearTimeout(toast._t);
      toast._t = setTimeout(function () {
        $toast.className = 'quick-toast';
      }, 1600);
    }
    if (window.Al) { window.Al.toast = toast; }

    /* ---- تفعيل الأقسام (النظام القديم panel-card) ---- */
    var catPills = document.querySelectorAll('.cat-pill');
    catPills.forEach(function (pill) {
      pill.addEventListener('click', function () {
        catPills.forEach(function (p) { p.classList.remove('active'); });
        pill.classList.add('active');
        var cat = pill.getAttribute('data-cat');
        document.querySelectorAll('#menuPanel .dish-item').forEach(function (item) {
          item.style.display = (cat === 'all' || item.getAttribute('data-cat') === cat) ? '' : 'none';
        });
      });
    });

    /* ---- البحث السريع ---- */
    var menuSearchInput = document.getElementById('menuSearchInput');
    if (menuSearchInput) {
      menuSearchInput.addEventListener('input', function () {
        var q = menuSearchInput.value.trim();
        document.querySelectorAll('#menuPanel .dish-item').forEach(function (item) {
          item.style.display = item.getAttribute('data-title').indexOf(q) !== -1 ? '' : 'none';
        });
      });
    }

    /* ---- إغلاق الخريطة/الفاتورة ---- */
    ['#liveFloorMap','#luxuryInvoice'].forEach(function (sel) {});
    var toggleFloorMapBtn = document.getElementById('toggleFloorMapBtn');
    var floorMapDrawer = document.getElementById('floorMapDrawer');
    if (toggleFloorMapBtn && floorMapDrawer) {
      toggleFloorMapBtn.addEventListener('click', function () {
        floorMapDrawer.classList.toggle('d-none');
      });
    }

    /* ---- إضافة للفاتورة + عدادات ---- */
    document.querySelectorAll('.add-to-cart-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var dish = btn.closest('.dish-item');
        var title = (dish && dish.getAttribute('data-title')) || 'صنف';
        var myToast = window.Al || null;
        if (myToast && myToast.toast) {
          myToast.toast('تمت إضافة «' + title + '» إلى الفاتورة الذهبية');
        }
        btn.classList.add('pressed');
        var countEl = document.getElementById('liveOrderCount');
        if (countEl) { countEl.textContent = parseInt(countEl.textContent || '0', 10) + 1; }
        setTimeout(function () { btn.classList.remove('pressed'); }, 350);
      });
    });

    /* ---- سلة الفاتورة المحلية (POS) ---- */
    var ticketItemsContainer = document.getElementById('ticketItemsContainer');
    var tickets = [];
    function renderTicket() {
      if (!ticketItemsContainer) { return; }
      var priceMap = { 'صينية أليجريا الفاخرة (٤ أفراد)': 1450, 'شوربة عدس شامي': 75, 'مشكل مشويات': 950 };
      var total = 0;
      var html = '';
      tickets.forEach(function (t) {
        var price = priceMap[t.name] || 0;
        var sub = price * t.qty;
        total += sub;
        html += '<div class="d-flex align-items-center justify-content-between py-1 border-bottom border-secondary-subtle">' +
                '<span class="small">' + t.name + ' × ' + t.qty + '</span>' +
                '<span class="tabular text-gold-strong small">' + sub + ' ج.م</span></div>';
      });
      ticketItemsContainer.innerHTML = html || '<div class="text-softest small text-center py-3">الفاتورة فارغة — اختر الأصناف من القائمة</div>';
      var totalEl = document.getElementById('cartTotal');
      if (totalEl) { totalEl.textContent = total + ' ج.م'; }
    }
    function addTicket(name) {
      var found = false;
      tickets.forEach(function (t) {
        if (t.name === name) { t.qty++; found = true; }
      });
      if (!found) { tickets.push({ name: name, qty: 1 }); }
      renderTicket();
    }
    window.addTicket = addTicket;
    /* ربط الأزرار المضافة بأناقة (مضاعفة للمركبات الأنانية) */
    function bindAddButtons() {
      document.querySelectorAll('[data-add-dish]').forEach(function (b) {
        b.onclick = function () { addTicket(b.getAttribute('data-add-dish')); };
      });
    }
    bindAddButtons();
    /* منع استنساخ المستخدمين للبدل في حال أُعيد ربط الـ DOM ديناميكياً */
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-add-dish]');
      if (t) { addTicket(t.getAttribute('data-add-dish')); }
    });
  })();
</script>
</body>
</html>
